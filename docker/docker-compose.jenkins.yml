# 젠킨스. 앱 배포와 생명주기가 달라서 파일을 따로 둔다.
#
#   cd ~/teacat
#   docker compose -f docker-compose.jenkins.yml up -d --build
#
# 🔴 앱 compose 와 합치지 말 것. 젠킨스가 앱을 재배포할 때 자기 자신을 내리게 된다.

# 프로젝트 이름을 분리한다. 없으면 폴더 이름(teacat)이 프로젝트가 되어,
# proxy.yml 을 올릴 때마다 "orphan containers (jenkins)" 경고가 뜬다.
name: teacat-jenkins

services:
  jenkins:
    build:
      # Dockerfile 은 jenkins/ 안에 둔다.
      # jenkins/.dockerignore 가 jenkins_home 을 컨텍스트에서 뺀다.
      context: ./jenkins
    image: teacat-jenkins:lts
    container_name: jenkins
    user: root
    ports:
      # ⚠️ 인터넷에 열려 있다. 배포 권한이 붙기 전에 보안그룹에서 팀 IP 로 제한할 것.
      - "9090:8080"
    volumes:
      - ./jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # 🔴 배포 대상 폴더. **호스트와 같은 경로**여야 한다.
      #    compose 안의 ./nginx 같은 상대경로는 호스트 도커 데몬이 해석하는데,
      #    젠킨스가 보는 경로와 데몬이 보는 경로가 다르면 엉뚱한 곳을 마운트한다.
      - /home/ubuntu/teacat:/home/ubuntu/teacat
    networks:
      - teacat-net
    restart: unless-stopped

networks:
  teacat-net:
    external: true
