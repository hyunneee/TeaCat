# 운영 환경 앱 스택. 앞단 nginx 는 docker-compose.proxy.yml 에 있다.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 개발(docker-compose.dev.yml)과 구조가 같다. 다른 점만 정리하면
#   - 컨테이너 이름 접두어가 prod-  (nginx 의 proxy_pass 가 prod-server 를 찾는다)
#   - 볼륨 이름이 달라 개발과 데이터가 섞이지 않는다 (compose project name 이 teacat-prod)
#   - 도메인·쿠키·싸피 콜백 주소가 teacat.site 기준이다
#
# 🔴 개발 스택과 같은 teacat-net 을 쓰지만 DB/Redis 는 각자 자기 것을 본다.
#    컨테이너 이름(dev-postgres / postgres)이 달라 서로 붙을 일이 없다.

name: teacat-prod

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teacat}
      POSTGRES_USER: ${POSTGRES_USER:-teacat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.prod 에 넣으세요}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-teacat} -d ${POSTGRES_DB:-teacat}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [teacat-net]
    # 포트를 열지 않는다. DB 접속이 필요하면 SSH 터널을 쓴다.

  redis:
    image: redis:8-alpine
    container_name: prod-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?.env.prod 에 넣으세요}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [teacat-net]

  minio:
    image: minio/minio
    container_name: prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [teacat-net]

  blockchain:
    image: teacat-blockchain:prod
    container_name: prod-blockchain
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CHAIN_ID: ${CHAIN_ID:-31221}
      RPC_URL: ${RPC_URL:-https://rpc.ssafy-blockchain.com}
      # 🔴 시크릿. .env.prod 에만 두고 절대 커밋하지 않는다.
      #    개발과 **다른 값**을 쓴다 — 마스터 니모닉이 같으면 두 환경이 같은 지갑을 공유한다.
      MASTER_MNEMONIC: ${MASTER_MNEMONIC:?.env.prod 에 넣으세요}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:?0x + 64자리 hex}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?16자 이상}
    mem_limit: 512m
    networks: [teacat-net]
    # 포트를 열지 않는다. 마스터 니모닉을 쥔 프로세스라 server 만 내부에서 붙는다.

  server:
    image: teacat-server:prod
    container_name: prod-server
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      blockchain: { condition: service_healthy }
    environment:
      # application.yaml 의 localhost 기본값을 컨테이너 주소로 덮어쓴다.
      # 스프링이 SCREAMING_SNAKE_CASE 환경변수를 yaml 키에 매핑해준다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-teacat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-teacat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # 🔴 개발과 다른 값을 쓴다. 같으면 개발에서 발급한 토큰이 운영에서도 통한다.
      JWT_SECRET: ${JWT_SECRET:?32바이트 이상}

      # MINIO_ENDPOINT 는 컨테이너 내부 주소라 브라우저가 열 수 없다. 그래서 presigned URL 은
      # MINIO_PUBLIC_BASE_URL 로 바꿔 내려주고, nginx 의 /storage/ 가 MinIO 로 넘긴다
      # (docker/nginx/conf.d/prod.conf). 서명이 내부 Host 로 계산되므로 nginx 가 Host 를 되돌려 보낸다.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: https://teacat.site/storage
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      BLOCKCHAIN_API_URL: http://blockchain:4000
      # blockchain 의 INTERNAL_API_KEY 와 같은 값이어야 한다. 틀리면 가입이 401 로 실패한다.
      BLOCKCHAIN_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BLOCKCHAIN_CHAIN_ID: ${CHAIN_ID:-31221}

      # 포토카드 도안의 그림과 메타데이터 JSON 을 IPFS 에 핀한다.
      # 🔴 빠지면 도안 생성만 IPFS_001 로 막히고 나머지는 정상 동작한다 — 배포는 성공한 것처럼
      #    보이고, 어드민이 도안을 만들려 할 때 처음 드러난다. 그래서 :? 로 기동을 막는다.
      # 🔴 CID 는 영원히 남지만 데이터는 누군가 핀하고 있어야 남는다. 이 계정이 만료되면
      #    이미 발행된 카드의 그림이 지갑에서 깨진다 (blockchain/PHOTOCARD_PLAN.md 3장).
      PINATA_JWT: ${PINATA_JWT:?Pinata 대시보드 API Keys 에서 발급}
      # 공용 게이트웨이(gateway.pinata.cloud)는 25KB 이미지에 25초 타임아웃이 실측됐다.
      # 대시보드 Gateways 의 전용 주소(https://<이름>.mypinata.cloud)를 쓴다.
      # 체인에 올라가는 값은 ipfs://<cid> 라, 이 주소를 바꿔도 온체인 값은 그대로다.
      PINATA_GATEWAY_URL: ${PINATA_GATEWAY_URL:?전용 게이트웨이 주소}

      # HTTPS 이고 프론트와 같은 도메인이다. Secure 를 켜고 SameSite 는 Lax 로 둔다
      REFRESH_COOKIE_SECURE: 'true'
      REFRESH_COOKIE_SAME_SITE: Lax
      REFRESH_COOKIE_PATH: /api/auth

      FRONTEND_BASE_URL: https://teacat.site
      SSAFY_CLIENT_SECRET: ${SSAFY_CLIENT_SECRET:-}
      # 🔴 SSAFY 개발자센터에 등록한 주소와 글자 하나까지 같아야 한다
      SSAFY_REDIRECT_URI: https://teacat.site/api/auth/oauth/ssafy/callback

      # API 문서는 운영에 내보내지 않는다. nginx 에서도 404 로 막지만, 앱에서도 끈다
      SPRINGDOC_API_DOCS_ENABLED: 'false'
      SPRINGDOC_SWAGGER_UI_ENABLED: 'false'
    # 🔴 이 제한이 없으면 JVM 이 호스트 메모리(16G)의 75% 를 최대 힙으로 잡는다.
    #    Dockerfile 의 -XX:MaxRAMPercentage=75 가 cgroup 제한을 읽기 때문이다.
    #    개발 스택의 JVM 과 합쳐 호스트를 넘지 않게 맞춘다.
    mem_limit: 2g
    networks: [teacat-net]
    # 포트를 열지 않는다. nginx 가 /api 를 프록시한다.

networks:
  teacat-net:
    external: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
