# 운영·개발이 함께 쓰는 앞단. teacat.site 와 dev.teacat.site 를 둘 다 받는다.
# 이걸 내리면 양쪽 다 끊긴다 — 앱 배포와 따로 관리한다.
services:
  nginx:
    image: nginx:stable
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # 프론트 정적 파일. 여기에 dist/ 내용을 넣으면 nginx 가 바로 읽는다
      # (컨테이너 재시작 불필요 — 설정을 바꿀 때만 reload 하면 된다)
      - ./frontend/dev:/usr/share/nginx/html/dev:ro
    networks:
      - teacat-net
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    networks:
      - teacat-net

networks:
  teacat-net:
    external: true
