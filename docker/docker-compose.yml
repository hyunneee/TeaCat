services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: teacat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teacat
      POSTGRES_USER: teacat
      POSTGRES_PASSWORD: teacat_local_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacat -d teacat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: teacat-redis
    restart: unless-stopped
    command: redis-server --requirepass teacat_local_pw
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "teacat_local_pw", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: