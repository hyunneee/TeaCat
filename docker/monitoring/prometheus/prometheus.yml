# Prometheus 스크레이프 설정 (EC2).
#
# 여기 적힌 주소를 15초마다 긁어서 저장하는 것이 전부다. Prometheus 는 MINTING 이 뭔지,
# 좌석이 뭔지 모른다 — 앱이 /metrics 로 내보낸 숫자만 받아 적는다.
#
# ── 스택 하나가 dev 와 prod 를 함께 본다 ──────────────────────────
# 두 스택이 같은 호스트의 같은 teacat-net 에 있으므로 컨테이너 이름만 다르다.
# 나눠 띄울 이유가 없고, 오히려 같은 화면에서 비교되는 편이 낫다 —
# 운영에서 처음 보는 문제가 dev 에는 이미 있었던 경우가 대부분이다.
#
# 구분은 env 라벨로 한다. 대시보드에서 env="prod" 로 좁히면 운영만 보인다.
#
# 🔴 아직 배포되지 않은 환경의 타겟은 DOWN 으로 보인다. 정상이다 — TargetDown 은
#    "최근 하루 안에 살아있던 타겟" 만 울리므로(rules/alerts.yml) 조용하고, 그 환경이
#    뜨는 순간 자동으로 감시 대상이 된다. 지금은 dev 만 살아 있다 (운영은 배포 전, 2026-09-09).

global:
  # 15초. 이보다 촘촘하게 해도 얻는 게 없다 — 앱 게이지 갱신 주기가 30초다
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # 이 Prometheus 가 어디서 도는지. env 는 타겟별 라벨로 따로 붙인다
    host: ec2

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ── 앱 계측 (직접 짠 지표가 나오는 곳) ─────────────────────────────
  - job_name: 'spring-server'
    # 🔴 8080 이 아니라 8081 이다. 8080 은 context-path 가 /api 라 nginx 를 통해
    #    인터넷에 열리고, 액추에이터를 거기 두면 그대로 노출된다.
    #    (server/src/main/resources/application.yaml 의 management.server.port)
    metrics_path: /actuator/prometheus
    static_configs:
      # 🔴 운영은 블루-그린이라 컨테이너 이름이 prod-server-blue|green 으로 바뀐다.
      #    여기를 색 이름으로 고치지 마라 — 전환할 때마다 타겟이 DOWN 이 된다.
      #    prod-server 는 두 색이 함께 다는 **네트워크 별칭**이고, 한 번에 한 색만
      #    살아 있어 그대로 풀린다 (docker/docker-compose.prod.yml).
      - targets: ['prod-server:8081']
        labels: { service: server, env: prod }
      - targets: ['dev-server:8081']
        labels: { service: server, env: dev }

  - job_name: 'blockchain-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['prod-blockchain:4000']
        labels: { service: blockchain, env: prod }
      - targets: ['dev-blockchain:4000']
        labels: { service: blockchain, env: dev }

  # ── 미들웨어 통계 (앱 협조 없이 나오는 것) ──────────────────────────
  # 🔴 좌석 선점이 Redis 가 아니라 Postgres 조건부 UPDATE 라, 티켓 오픈의 병목이
  #    여기서 보인다 (BookingService 의 hold — 행 락과 커넥션 풀).
  - job_name: 'postgres'
    static_configs:
      # exporter 는 환경마다 하나다 (DB 비밀번호가 다르다). prod 쪽은 compose profile 로
      # 운영이 뜰 때 켠다 — 그전까지 이 타겟은 DOWN 으로 보이지만, TargetDown 은
      # "최근 하루 안에 살아있던 타겟" 만 보므로 울리지 않는다 (rules/alerts.yml).
      - targets: ['postgres-exporter-dev:9187']
        labels: { service: postgres, env: dev }
      - targets: ['postgres-exporter-prod:9187']
        labels: { service: postgres, env: prod }

  # ── 인프라 ────────────────────────────────────────────────────────
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
