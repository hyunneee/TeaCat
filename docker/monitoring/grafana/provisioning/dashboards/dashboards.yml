apiVersion: 1

providers:
  - name: 'teacat'
    orgId: 1
    folder: 'teacat'
    type: file
    disableDeletion: false
    # UI 에서 고친 것을 파일로 되돌리지 않는다. 실험은 UI 에서 하고,
    # 확정된 것만 JSON 을 여기 커밋해서 재현 가능하게 만든다
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
