# 알림 라우팅.
#
# 🔴 WEBHOOK_URL 은 이 파일에 적지 않는다. .env.monitoring 에 두고 환경변수로 주입한다 —
#    Discord/Mattermost 웹훅 주소는 그 자체가 "누구나 이 채널에 글을 쓸 수 있는" 토큰이다.
#    (아래 url_file 로 읽으므로 compose 에서 시크릿 파일을 마운트해도 된다)

global:
  resolve_timeout: 5m

route:
  # 같은 종류의 알림을 묶어서 한 번에 보낸다. 티켓 오픈에 컨테이너 여러 개가 동시에
  # 메모리를 치면 알림이 10개 오는 대신 1개로 묶인다.
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  # 낫지 않는 알림을 다시 알리는 주기. 너무 짧으면 알림 피로가 오고,
  # 너무 길면 잊는다. 4시간이 무난하다.
  repeat_interval: 4h
  receiver: 'default'

  routes:
    # critical 은 묶지 말고 빨리 보낸다 — 발행 적체·RPC 두절은 1분이 아깝다
    - matchers:
        - severity = "critical"
      receiver: 'default'
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # 대상이 죽었으면(TargetDown) 그 대상에서 나오던 다른 알림은 억제한다.
  # 안 그러면 서버 하나 내려갔을 때 알림이 5개씩 온다.
  - source_matchers:
      - alertname = "TargetDown"
    target_matchers:
      - severity = "warning"
    equal: ['job']

receivers:
  - name: 'default'
    webhook_configs:
      # Discord 로 바로 보내려면 주소 끝에 /slack 을 붙이고 Slack 포맷을 쓰거나,
      # alertmanager-discord 같은 어댑터를 하나 두면 된다.
      - url_file: /etc/alertmanager/webhook_url
        send_resolved: true
