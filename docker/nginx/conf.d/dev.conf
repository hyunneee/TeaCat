server {
    listen 80;
    server_name dev.teacat.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev.teacat.site;

    # 인증서 하나에 teacat.site 와 dev.teacat.site 가 함께 들어있다 (SAN).
    ssl_certificate /etc/letsencrypt/live/teacat.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teacat.site/privkey.pem;

    location / {
        return 200 "nginx is up (dev, https), backend not deployed yet";
        add_header Content-Type text/plain;
    }
}
