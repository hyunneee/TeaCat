server {
    listen 80;
    server_name dev.teacat.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # 홈 한 화면에서 이미지를 십수 장 동시에 받는다. HTTP/1.1 은 호스트당 6개까지라
    # 나머지가 줄을 서서 기다렸다 — 그게 Speed Index 의 큰 몫이었다.
    # (nginx 1.25.1+ 문법. `listen ... http2` 는 이 버전부터 지원 중단 경고가 난다)
    http2 on;
    server_name dev.teacat.site;

    # 인증서 하나에 teacat.site 와 dev.teacat.site 가 함께 들어있다 (SAN).
    ssl_certificate /etc/letsencrypt/live/teacat.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teacat.site/privkey.pem;

    # 주소창에 dev.teacat.site 를 그냥 치면 첫 요청 한 번은 평문 HTTP 로 나간다.
    # 이 헤더를 한 번 받으면 그 다음부터 브라우저가 알아서 HTTPS 로만 붙는다.
    #
    # 🔴 always 가 있어야 4xx/5xx 응답에도 붙는다. 없으면 2xx/3xx 에만 나간다.
    # 🔴 includeSubDomains 는 넣지 않는다. 이 인증서는 teacat.site 와 dev 뿐인데
    #    그걸 켜면 앞으로 만들 모든 서브도메인이 HTTPS 없이는 접속 불가가 된다.
    # 🔴 preload 도 넣지 않는다. HSTS preload 목록은 등재 후 해제가 매우 느리다.
    #
    # 🔴🔴 아래 location 몇 곳에 이 줄이 또 있다. 중복이 아니다 —
    #      nginx 의 add_header 는 상속이 아니라 **치환**이다. 하위 블록이 자기
    #      add_header 를 하나라도 두면 상위에서 내려온 헤더가 통째로 사라진다.
    #      Cache-Control 을 붙이는 location 마다 HSTS 를 다시 적어야 한다.
    #      (지우면 그 경로의 응답에서 HSTS 가 조용히 빠진다)
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html/dev;
    index index.html;

    # ── API ───────────────────────────────────────────
    # 서버의 context-path 가 /api 라 프리픽스를 떼지 않고 그대로 넘긴다.
    #
    # 🔴 proxy_pass 에 변수를 쓰는 이유:
    #    주소를 리터럴로 적으면 nginx 가 기동할 때 이름을 한 번만 푼다.
    #    dev-server 가 내려가 있으면 nginx 자체가 안 뜨고, 그러면 운영(teacat.site)까지
    #    같이 죽는다. 변수로 두면 요청마다 다시 풀고, 뒤가 없으면 그 요청만 502 다.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://dev-server:8080;
        proxy_pass $api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 🔴 이 세 줄이 있어야 스프링(forward-headers-strategy: framework)이 자기 주소를
        #    https://dev.teacat.site 로 재구성한다. Proto 만 주고 Host/Port 를 빼면
        #    구성에 따라 포트가 8080 으로 남아 Origin 대조가 어긋난다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 결제 승인·체인 호출이 끼면 기본 60초로는 짧다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;

        # 스트리밍 응답이 중간에 고이지 않게. 캐시 금지 헤더는 스프링 시큐리티가
        # 이미 모든 응답에 붙이므로 여기서 또 붙이지 않는다 (헤더가 두 번 나간다).
        proxy_buffering off;
    }

    # 모니터링 대시보드 (Grafana). 모니터링 스택(docker-compose.monitoring.yml)의 mon-grafana 로 넘긴다.
    # 🔴 proxy_pass 에 변수를 쓰는 이유는 /api/ 와 같다 — 모니터링 스택이 내려가 있어도 nginx 는 떠야 한다.
    #    정적으로 적으면 mon-grafana 를 못 찾는 순간 nginx -t 가 실패해 **앱 배포까지 전부** 막힌다.
    # 경로는 바꾸지 않는다. Grafana 가 GF_SERVER_SERVE_FROM_SUB_PATH=true 로 /dashboard/ 접두어를 스스로 처리한다.
    # 접근 제어는 Grafana 로그인(.env.monitoring 의 관리자 계정)이다 — 익명 접속·가입은 꺼져 있다.
    location = /dashboard { return 301 /dashboard/; }
    location /dashboard/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana http://mon-grafana:3000;
        proxy_pass $grafana;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live(실시간 갱신)가 웹소켓을 쓴다. 없으면 대시보드는 뜨지만 갱신이 폴링으로 떨어진다
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 이미지 저장소(MinIO) ─────────────────────────────
    # 서버가 만드는 presigned URL 은 https://dev.teacat.site/storage/<버킷>/<키>?서명 이다
    # (MINIO_PUBLIC_BASE_URL). /storage/ 를 떼고 MinIO 로 넘긴다. 조회(GET)와 브라우저 직접 업로드(PUT) 모두 이 길로 온다.
    #
    # 🔴 Host 를 dev-minio:9000 으로 되돌려 보내야 한다. 서명(SigV4)이 서버가 붙는 주소(MINIO_ENDPOINT)의
    #    Host 로 계산되어 있어서, $host(dev.teacat.site)를 넘기면 MinIO 가 서명 불일치로 403 을 준다.
    # 🔴 proxy_pass 에 변수를 쓰는 이유는 /api/ 와 같다 — dev-minio 가 없어도 nginx 는 떠야 한다.
    #    서비스 이름(minio)은 dev·prod 스택이 같은 네트워크에 있어 겹치므로 컨테이너 이름을 쓴다.
    location /storage/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $minio http://dev-minio:9000;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $minio;

        proxy_http_version 1.1;
        proxy_set_header Host dev-minio:9000;
        proxy_set_header Connection "";

        # 이미지 업로드(최대 20MB)가 서버를 거치지 않고 여기로 바로 온다
        client_max_body_size 25m;
        proxy_request_buffering off;
        proxy_buffering off;

        # MinIO 가 Cache-Control 을 주지 않아 이미지가 매번 다시 내려왔다.
        #
        # ⚠️ 다만 이것만으로는 재방문 캐시가 살아나지 않는다. 조회 주소가
        #    **프리사인드 URL(유효시간 10분)** 이라 서명 쿼리가 매번 달라지고,
        #    브라우저 캐시 키는 쿼리까지 포함하기 때문이다.
        #    한 화면 안에서 같은 이미지를 두 번 쓰는 경우(목록→상세)만 이득이 있다.
        #    제대로 고치려면 주소가 고정돼야 한다 — 포스터·배너는 공개 자료이므로
        #    서명을 걷고 고정 주소로 주는 쪽이 맞다 (접근 모델 변경이라 별도 논의).
        proxy_hide_header Cache-Control;
        expires 10m;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 파일명에 해시가 박혀 있어 영구 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # 🔴 =404 를 빼면 안 된다. 모델 파일이 없을 때 index.html 이 200 으로 내려가면
    #    onnxruntime 이 HTML 을 모델로 읽다가 protobuf 에러로 죽는다.
    location /models/ {
        # 모델은 10MB 다. 캐시 헤더가 없어서 재방문마다 다시 받고 있었다.
        # 🔴 파일명에 버전이 없으므로 immutable 을 붙이면 안 된다 — 모델을 교체해도
        #    캐시가 1년 버틴다. 30일이면 재방문 부담은 사라지고 교체도 한 달 안에 퍼진다.
        #    (앱은 Cache API 로도 한 번 더 캐시한다 — 둘은 따로 동작한다)
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # 서비스워커가 캐시되면 새 배포가 사용자에게 전달되지 않는다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # SPA 폴백. /login 같은 경로는 파일이 없으므로 index.html 을 준다.
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }
}
