server {
    listen 80;
    server_name teacat.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name teacat.site;

    ssl_certificate /etc/letsencrypt/live/teacat.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teacat.site/privkey.pem;

    location / {
        return 200 "nginx is up (prod, https), backend not deployed yet";
        add_header Content-Type text/plain;
    }
}
