user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 백엔드가 multipart 를 100MB 까지 받는다. 여기가 작으면 nginx 가 먼저 413 을 낸다.
    client_max_body_size 100m;

    sendfile on;
    keepalive_timeout 65;

    # ── 압축 ──────────────────────────────────────────────────
    # 이게 꺼져 있어서 JS 번들(427KB)이 무압축으로 나가고 있었다.
    # 텍스트 자원은 대개 1/3 로 줄어든다 — FCP 에 바로 듣는다.
    gzip on;
    # 프록시를 거친 응답도 압축한다. 기본값(off)이면 /api 응답이 그대로 나간다
    gzip_proxied any;
    # 중간 캐시가 압축본을 비압축 클라이언트에게 주지 않도록
    gzip_vary on;
    # 6 이상은 CPU 만 더 쓰고 크기는 거의 안 줄어든다
    gzip_comp_level 6;
    # 1KB 미만은 헤더 오버헤드가 더 커서 이득이 없다
    gzip_min_length 1024;
    #
    # 🔴 여기에 application/wasm 과 application/octet-stream 을 넣지 마세요.
    #    ORT 런타임은 빌드가 이미 .wasm.gz 로 만들어 두고(scripts/compress-wasm.mjs)
    #    워커가 그걸 받아 풉니다 — 또 압축하면 CPU 만 씁니다.
    #    ONNX 모델(octet-stream)도 이미 양자화돼 있어 거의 줄지 않습니다.
    #    text/html 은 항상 압축되므로 목록에 적지 않습니다(적으면 경고가 납니다).
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
