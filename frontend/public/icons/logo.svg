<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="티캣">
  <!-- 티캣 로고: 티켓 한 장의 위쪽 두 귀퉁이를 고양이 귀로 세운 형태 -->
  <rect width="64" height="64" rx="15" fill="#3E2A63" />

  <!-- 티켓 본체 + 귀 -->
  <path
    fill="#F4EEFF"
    d="M14 27.5 20.5 15l7.2 5.2h8.6L43.5 15 50 27.5v13a4.5 4.5 0 0 1-4.5 4.5h-1.9a5.6 5.6 0 0 0 0 5.6h1.9A4.5 4.5 0 0 1 50 55.1v.4H14v-.4a4.5 4.5 0 0 1 4.5-4.5h1.9a5.6 5.6 0 0 0 0-5.6h-1.9A4.5 4.5 0 0 1 14 40.5z"
  />
  <!-- 귀 안쪽 -->
  <path fill="#C9A8FF" d="M21.4 19.6 25 22.2h-4.9zM42.6 19.6 39 22.2h4.9z" />

  <!-- 절취선 -->
  <path
    stroke="#3E2A63"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-dasharray="2.4 3.4"
    d="M22.8 48h18.4"
  />

  <!-- 눈 -->
  <ellipse cx="26.2" cy="33.2" rx="2.5" ry="3.1" fill="#3E2A63" />
  <ellipse cx="37.8" cy="33.2" rx="2.5" ry="3.1" fill="#3E2A63" />
  <!-- 코 -->
  <path fill="#3E2A63" d="M32 38.4a2.6 2.6 0 0 1-2.3-1.5.5.5 0 0 1 .5-.7h3.6a.5.5 0 0 1 .5.7A2.6 2.6 0 0 1 32 38.4" />

  <!-- 수염 -->
  <g stroke="#3E2A63" stroke-width="1.3" stroke-linecap="round" opacity=".55">
    <path d="M18.4 32.4h4.2M18.9 36.6l3.8-1M45.6 32.4h-4.2M45.1 36.6l-3.8-1" />
  </g>
</svg>
