server:
  servlet:
    # 프론트가 /api 프리픽스로 호출한다 (vite 프록시가 경로를 그대로 넘긴다)
    context-path: /api

spring:
  application:
    name: teacat

  # 로컬 시크릿은 server/.env 에 둔다 (커밋 안 됨). 파일이 없어도 그냥 뜬다
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/teacat
    username: teacat
    password: teacat_local_pw

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: teacat_local_pw

jwt:
  secret: ${JWT_SECRET:teacat-local-dev-access-token-secret-key-change-me-32bytes-over}
  access-token-validity: 1h
  refresh-token-validity: 14d
  # 프론트와 도메인이 다른 환경(운영)에서는 same-site: None, secure: true 여야 쿠키가 전달된다.
  # 개발은 vite 프록시를 타서 같은 사이트이므로 Lax 로 충분하다.
  refresh-cookie:
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    # 쿠키 path 는 브라우저가 보는 경로 기준이다. 프론트가 /api 프리픽스로 호출하면 /api/auth 로 좁혀야 한다.
    path: ${REFRESH_COOKIE_PATH:/api/auth}

cors:
  # allowCredentials 를 켜야 해서 와일드카드를 못 쓴다. 허용할 프론트 주소를 명시한다
  allowed-origins:
    - http://localhost:5173
    - http://localhost:4173

app:
  # 외부 로그인을 마치고 사용자를 돌려보낼 프론트 주소
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  oauth-redirect-path: /oauth/callback

oauth:
  # client-secret 은 이 파일에 적지 말고 환경변수 SSAFY_CLIENT_SECRET 로만 주입합니다.
  #   (client-id 는 인가 주소에 그대로 실려 나가는 공개 값이라 기본값으로 둡니다)
  #   secret 이 비어 있으면 SSAFY 로그인은 AUTH_008 로 거절되고 나머지 기능은 그대로 동작합니다.
  ssafy:
    client-id: ${SSAFY_CLIENT_ID:b0fb61a5-4caa-435c-87fd-a38d8007ab49}
    client-secret: ${SSAFY_CLIENT_SECRET:}
    redirect-uri: ${SSAFY_REDIRECT_URI:http://localhost:8080/api/auth/oauth/ssafy/callback}
    authorization-uri: ${SSAFY_AUTHORIZATION_URI:https://project.ssafy.com/oauth/sso-check}
    token-uri: ${SSAFY_TOKEN_URI:https://project.ssafy.com/ssafy/oauth2/token}
    user-info-uri: ${SSAFY_USER_INFO_URI:https://project.ssafy.com/ssafy/resources/userInfo}
    # SSAFY 문서에 state 가 없어 기본은 끕니다. 지원이 확인되면 true 로 켜세요.
    #   꺼도 CSRF 방어는 유지됩니다 — 같은 값을 httpOnly 쿠키로 들고 있다가 콜백에서 대조합니다.
    send-state: ${SSAFY_SEND_STATE:false}

blockchain:
  # 블록체인 서비스(Node.js)는 마스터 니모닉을 쥐고 있어 루프백에만 열려 있습니다
  base-url: ${BLOCKCHAIN_API_URL:http://127.0.0.1:4000}
  # blockchain/.env 의 INTERNAL_API_KEY 와 같은 값이어야 합니다. server/.env 에 넣으세요
  internal-api-key: ${BLOCKCHAIN_INTERNAL_API_KEY:}
  # blockchain/.env 의 CHAIN_ID 와 반드시 같아야 합니다 (31221 SSAFY 체인 / 31337 로컬)
  chain-id: ${BLOCKCHAIN_CHAIN_ID:31221}
  connect-timeout: 3s
  # 체인에 트랜잭션을 보내고 오므로 넉넉히 잡습니다 (SSAFY 체인은 블록이 10초)
  read-timeout: 20s
