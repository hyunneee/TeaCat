plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.teacat'
version = '0.0.1-SNAPSHOT'
description = 'teacat'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 메트릭. actuator 가 /actuator/prometheus 를 열고, 이 레지스트리가 Prometheus 형식으로 뱉는다.
    // 넣기만 하면 JVM/GC/HikariCP/톰캣/HTTP 지연이 코드 한 줄 없이 따라온다.
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 벡터
    implementation 'org.hibernate.orm:hibernate-vector'
    implementation 'com.pgvector:pgvector:0.1.6'

    // 오브젝트 스토리지 (MinIO / S3 호환)
    implementation 'io.minio:minio:8.5.17'

    // 에러 리포팅. Prometheus/Grafana 는 "몇 건 터졌나"를 보여주고,
    // 이건 "무엇이 왜 터졌나"(스택트레이스)를 보여준다.
    //
    // 🔴 sentry-spring-boot-starter-jakarta 를 쓰지 않는다. 스프링 부트 4 에서 뜨지 않는다 —
    //    8.16.0 의 SentrySpanRestClientConfiguration 이 org.springframework.boot.web.client.
    //    RestClientCustomizer 를 참조하는데, 부트 4 에서 org.springframework.boot.restclient
    //    로 옮겨간 클래스다. 자동설정 조건을 읽다 NoClassDefFoundError 가 나면서
    //    **애플리케이션 컨텍스트가 통째로 뜨지 않는다.**
    //    그래서 자동설정 없이 로그백 어펜더만 쓴다 (SentryConfig 참고).
    //    Sentry 가 부트 4 를 지원하면 그때 스타터로 갈아타면 된다.
    implementation 'io.sentry:sentry-logback:8.16.0'

    // 인프로세스 캐시. 좌석맵 폴링이 같은 응답을 초당 수백~수천 번 요구하는데,
    // 1초 스냅샷을 재사용해 DB 조회를 회차당 초당 1회로 고정한다 (SeatMapCacheRepository).
    //
    // 🔴 스프링의 캐시 추상화(@Cacheable / spring-boot-starter-cache)는 쓰지 않는다.
    //    이 캐시는 TTL 이 1초이고 무효화를 하지 않아서 추상화가 주는 것(선언적 evict,
    //    캐시 매니저 전환)이 필요 없고, 대신 Caffeine 의 get(key, loader) 가 주는
    //    **동일 키 단일 실행**이 필요하다 — 만료 직후 몰려온 요청 중 하나만 DB 로 간다.
    //    버전은 부트 BOM 이 관리한다 (io.spring.dependency-management).
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── 마이그레이션 파일 이름 검사 ──────────────────────────────
// 🔴 **버전이 겹치면 Flyway 는 마이그레이션을 하나도 적용하지 않고 기동을 멈춘다.**
//    그래서 서버가 통째로 안 뜨고, 배포까지 나가면 그 환경이 502 가 된다.
//    2026-09-22 하루에만 두 번 났다 — 각자 브랜치에서는 멀쩡한데 dev 로 합쳐지는
//    순간 같은 버전이 둘이 되기 때문이다. 만든 사람은 끝까지 모른다.
//
//    processResources 에 물려 둔 이유는 그래야 **빠져나갈 길이 없기** 때문이다.
//    test · bootRun · bootJar(=도커 이미지 빌드) 가 전부 이 태스크를 거친다.
//    파일 이름만 훑으므로 몇 밀리초다.
//
//    배포 파이프라인에도 같은 검사가 하나 더 있다 (Jenkinsfile '사전 점검').
//    그쪽은 이미지 빌드보다 **먼저** 돌아서, 걸리면 배포가 멈추고 돌던 컨테이너가
//    그대로 살아 있다. 여기서 막는 것과 목적이 다르다.
tasks.register('checkMigrationVersions') {
    group = 'verification'
    description = '마이그레이션 버전이 겹치는지, 파일 이름이 규칙에 맞는지 본다'

    def migrationDir = file('src/main/resources/db/migration')
    inputs.dir(migrationDir).withPropertyName('migrations').withPathSensitivity(PathSensitivity.NAME_ONLY)
    outputs.upToDateWhen { true }

    doLast {
        def names = migrationDir.listFiles()
                ?.findAll { it.isFile() && it.name.endsWith('.sql') }
                ?.collect { it.name }
                ?.sort() ?: []
        def problems = []

        // Flyway 가 읽을 수 있는 모양인가. V<버전>__<설명>.sql 이어야 한다
        def shaped = ~/^V([^_]+(?:_[^_]+)*)__(.+)\.sql$/
        def malformed = names.findAll { !(it ==~ shaped) }
        if (malformed) {
            problems << "Flyway 가 읽을 수 없는 이름입니다 (V<버전>__<설명>.sql):\n    " + malformed.join('\n    ')
        }

        // 팀 규칙은 날짜+시각이다 (server/CLAUDE.md 5장). V1__schema.sql 은 규칙보다
        // 먼저 있던 최초 스키마라 예외로 둔다 — 이름을 바꾸면 이미 적용된 환경이 깨진다
        def dated = ~/^V\d{8}_\d{4}__[a-z0-9_]+\.sql$/
        def offConvention = names.findAll { it != 'V1__schema.sql' && !(it ==~ dated) }
        if (offConvention) {
            problems << "이름이 규칙과 다릅니다. V<날짜8자리>_<시각4자리>__<소문자_설명>.sql 입니다:\n    " +
                    offConvention.join('\n    ')
        }

        // 본론 — 같은 버전을 두 파일이 잡고 있나
        def byVersion = [:].withDefault { [] }
        names.each { name ->
            def matcher = name =~ shaped
            if (matcher.matches()) {
                byVersion[matcher[0][1]] << name
            }
        }
        byVersion.findAll { version, files -> files.size() > 1 }.each { version, files ->
            problems << "버전 $version 을 파일 ${files.size()} 개가 함께 쓰고 있습니다:\n    " + files.join('\n    ') +
                    "\n  → 나중에 머지된 쪽의 버전을 뒤로 미세요. 내용은 그대로 두고 파일 이름만 바꿉니다.\n" +
                    "     이미 적용된 마이그레이션의 이름은 바꾸면 안 됩니다 (Flyway 가 '적용됐는데 파일이 없다' 로 거부합니다)."
        }

        if (problems) {
            throw new GradleException(
                    "\n마이그레이션 파일에 문제가 있습니다. 이대로 두면 서버가 기동하지 못합니다.\n\n" +
                            problems.collect { "  - $it" }.join('\n\n') + '\n')
        }
    }
}

tasks.named('processResources') {
    dependsOn 'checkMigrationVersions'
}
