plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.teacat'
version = '0.0.1-SNAPSHOT'
description = 'teacat'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 메트릭. actuator 가 /actuator/prometheus 를 열고, 이 레지스트리가 Prometheus 형식으로 뱉는다.
    // 넣기만 하면 JVM/GC/HikariCP/톰캣/HTTP 지연이 코드 한 줄 없이 따라온다.
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 벡터
    implementation 'org.hibernate.orm:hibernate-vector'
    implementation 'com.pgvector:pgvector:0.1.6'

    // 오브젝트 스토리지 (MinIO / S3 호환)
    implementation 'io.minio:minio:8.5.17'

    // 에러 리포팅. Prometheus/Grafana 는 "몇 건 터졌나"를 보여주고,
    // 이건 "무엇이 왜 터졌나"(스택트레이스)를 보여준다.
    //
    // 🔴 sentry-spring-boot-starter-jakarta 를 쓰지 않는다. 스프링 부트 4 에서 뜨지 않는다 —
    //    8.16.0 의 SentrySpanRestClientConfiguration 이 org.springframework.boot.web.client.
    //    RestClientCustomizer 를 참조하는데, 부트 4 에서 org.springframework.boot.restclient
    //    로 옮겨간 클래스다. 자동설정 조건을 읽다 NoClassDefFoundError 가 나면서
    //    **애플리케이션 컨텍스트가 통째로 뜨지 않는다.**
    //    그래서 자동설정 없이 로그백 어펜더만 쓴다 (SentryConfig 참고).
    //    Sentry 가 부트 4 를 지원하면 그때 스타터로 갈아타면 된다.
    implementation 'io.sentry:sentry-logback:8.16.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
